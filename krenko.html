<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokens Calculators</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><strong><a href="./">Token Calculator</a> > Krenko</strong></li>
      </ul>
    </nav>
  </header>

  <main class="container-fluid">
    <section>
      <form id="form">
        <fieldset>
          <label>
            Number of Krenkos
            <input id="krenkos-input" type="number" inputmode="numeric" value="1" min="1" step="1" name="krenkos"
              aria-describedby="krenkos-helper" />
            <small id="krenkos-helper">
              That will be tapped
            </small>
          </label>
          <label>
            Number of Goblins
            <input id="goblins-input" type="number" inputmode="numeric" value="1" min="1" step="1" name="goblins"
              aria-describedby="goblins-helper" />
            <small id="goblins-helper">
              Including Krenkos
            </small>
          </label>
        </fieldset>
      </form>
    </section>
    <section>
      <p>Number of generated Goblin tokens: <span id="result"></span></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('form')
    form.addEventListener('submit', ev => ev.preventDefault())
    // T = g * (2 ^ k - 1)
    // - T: number of generated tokens
    // - g: number of goblins
    // - k: number of Krenkos (that will be tapped)
    const calculateGeneratedTokens = () => {
      const { goblins, krenkos } = Object.fromEntries(new FormData(form))

      if (goblins < 1 || krenkos < 1) return

      const generatedTokensCount = parseInt(goblins) * (Math.pow(2, parseInt(krenkos)) - 1)
      document.getElementById('result').textContent = generatedTokensCount.toString()
    }

    const goblinsInput = document.getElementById('goblins-input')
    goblinsInput.addEventListener('input', calculateGeneratedTokens)
    document.getElementById('krenkos-input').addEventListener('input', ev => {
      const krenkosCount = parseInt(ev.target.value)
      const goblinsCount = parseInt(goblinsInput.value)
      if (goblinsCount < krenkosCount) {
        goblinsInput.value = krenkosCount.toString()
      }
      calculateGeneratedTokens()
    })
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>

</html>
