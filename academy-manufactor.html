<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokens Calculators</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><strong><a href="./">Token Calculator</a> > Academy Manufactor</strong></li>
      </ul>
    </nav>
  </header>

  <main class="container-fluid">
    <section>
      <form id="form">
        <fieldset>
          <label>
            Number of Academy Manufactors
            <input id="academy-manufactor-input" type="number" inputmode="numeric" value="1" min="1" step="1"
              name="academy-manufactor" />
        </fieldset>
      </form>
    </section>
    <section>
      <p>Number of generated tokens of each type: <span id="result"></span></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('form')
    form.addEventListener('submit', ev => ev.preventDefault())

    // T = 3 ^ (n - 1)
    // - T: number of generated tokens (of each type)
    // - n: number of Academy Manufactors
    const calculateGeneratedTokens = () => {
      const { 'academy-manufactor': academyManufactor } = Object.fromEntries(new FormData(form))

      if (academyManufactor < 1) return

      const generatedTokensCount = Math.pow(3, academyManufactor - 1)
      document.getElementById('result').textContent = generatedTokensCount.toString()
    }

    document.getElementById('academy-manufactor-input').addEventListener('input', calculateGeneratedTokens)
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>

</html>
